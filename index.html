<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema Seat View</title>
<style>
:root{--bg:#f3f3f4;--card:#fff;--ink:#101012;--mute:#6b6b72;--line:#e3e3e6;--red:#d71920;--seat:#d9d9dc;--green:#12b312;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#17171a;--ink:#f2f2f3;--mute:#9a9aa2;--line:#2a2a2f;--seat:#3b3b41}}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#17171a;--ink:#f2f2f3;--mute:#9a9aa2;--line:#2a2a2f;--seat:#3b3b41}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
header{background:#000;color:#fff;display:flex;align-items:center;gap:20px;padding:14px 24px}
header b{font-size:20px;letter-spacing:.5px}
header b i{font-style:normal;color:var(--red)}
header span{color:#a8a8ae;font-size:14px}
main{max-width:1320px;margin:0 auto;padding:20px 20px 60px}
h2{font-size:22px;margin:28px 0 12px}
.movies{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.mv{flex:0 0 130px;background:none;border:2px solid transparent;border-radius:8px;padding:0;text-align:left}
.mv.on{border-color:var(--red)}
.mv .p{aspect-ratio:2/3;border-radius:6px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:8px;font-weight:700;font-size:13px;color:#fff}
.mv small{display:block;padding:6px 4px 4px;color:var(--mute)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--mute);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:700}
.cin{background:var(--card);border-radius:8px;padding:16px;margin-top:14px}
.cin h3{margin:0 0 12px;font-size:18px}
.ses{display:flex;flex-wrap:wrap;gap:8px}
.ses button{display:flex;border:0;background:var(--bg);border-radius:4px;overflow:hidden;padding:0;text-align:left;min-width:150px;outline-offset:2px}
.ses button.on{outline:2px solid var(--ink)}
.ses i{width:10px;flex:none}
.ses span{padding:8px 12px;font-size:12px;color:var(--mute)}
.ses span b{display:block;font-size:19px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.card{background:var(--card);border-radius:8px;padding:16px}
.scroll{overflow-x:auto}
.screen{width:70%;min-width:420px;margin:0 auto 6px;height:34px;background:linear-gradient(#bbb,var(--card));clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);opacity:.7}
.fc{text-align:center;color:var(--mute);font-size:12px;font-weight:700;margin-bottom:14px}
#map{display:grid;grid-template-columns:20px repeat(40,minmax(11px,1fr));gap:3px;min-width:680px}
#map .l{font-size:11px;font-weight:700;color:var(--mute);display:flex;align-items:center}
.s{aspect-ratio:1;border:0;padding:0;border-radius:3px;background:var(--seat);font-size:9px;color:transparent;position:relative}
.s.r{background:var(--red);cursor:not-allowed}
.s.r::after{content:"\00d7";color:#fff;font-size:13px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s.w{background:#8e8e95}
.s.sel{background:var(--green)}
.s:not(.r):hover{outline:2px solid var(--ink);z-index:1}
.leg{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:16px;font-size:12px;color:var(--mute)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.view{position:sticky;top:12px}
.view h3{margin:0 0 10px;font-size:18px}
canvas{width:100%;display:block;border-radius:6px;background:#000;aspect-ratio:16/9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:17px;color:var(--ink)}
.verdict{font-weight:700;font-size:16px;margin:2px 0 4px}
.note{color:var(--mute);font-size:13px;margin:0 0 12px}
.btn{width:100%;border:0;border-radius:999px;padding:13px;background:#000;color:#fff;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);margin-bottom:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.on{display:flex}
.ov div{width:min(1200px,100%);color:#fff}
.ov canvas{aspect-ratio:16/9}
.ov p{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.ov button{background:#fff;color:#000;border:0;border-radius:999px;padding:8px 16px;font-weight:700}
*{font-weight:400!important}
.hero{position:relative;border-radius:8px;overflow:hidden;color:#fff;background:#111 center/cover;padding:28px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.15))}
.hero>*{position:relative;max-width:640px;margin:0}
.hero h1{font-size:32px}.hero p{color:#d4d4d8;font-size:14px}
.chip{font-size:12px;color:var(--mute);margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip2{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px}.chip2.on{background:var(--ink);color:var(--bg)}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
html{scroll-behavior:smooth}
.card,.cin{border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05)}
.s{transition:background .15s,transform .12s}
.s:not(.r):hover{transform:scale(1.3)}
.mv .p{transition:transform .2s,box-shadow .2s}.mv:hover .p{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.ses button{transition:transform .15s,box-shadow .15s}.ses button:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn{transition:opacity .2s,transform .15s}.btn:not(:disabled):hover{transform:translateY(-1px)}
canvas{box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.by{position:fixed;right:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:9px;color:var(--mute);opacity:.6;text-decoration:none}
@media (max-width:980px){.grid2{grid-template-columns:1fr}.view{position:static}}
</style>
</head>
<body>
<header><b>EVENT<i>.</i> Seat View</b><span>See the screen from your seat before you book</span></header>
<main>
<div class="hero" id="hero"></div>
<h2>Now showing<span class="chip" id="src"></span></h2>
<div class="movies" id="movies"></div>
<h2>Pick a session</h2>
<div class="tabs" id="days"></div>
<div id="cins"></div>
<h2 id="seatTitle">Choose your seat</h2>
<div class="grid2">
  <div class="card">
    <div class="scroll">
      <div class="screen"></div>
      <div class="fc">Front of Cinema</div>
      <div id="map"></div>
    </div>
    <div class="leg"><span><i style="background:var(--seat)"></i>Available</span><span><i style="background:var(--green)"></i>Your seat</span><span><i style="background:var(--red)"></i>Reserved</span><span><i style="background:#8e8e95"></i>Wheelchair</span></div>
  </div>
  <div class="card view">
    <h3 id="vt">View from your seat</h3>
    <canvas id="cv" width="960" height="540"></canvas>
    <div class="stats"><div>Screen width<b id="s1">-</b></div><div>Look up<b id="s2">-</b></div><div>Distance<b id="s3">-</b></div></div>
    <div class="verdict" id="vd"></div>
    <p class="note" id="vn">Hover over a seat to preview it. Tap a seat to pick it.</p>
    <div class="chips" id="chips"></div>
    <p class="note">Tickets <select id="qty"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></p>
    <button class="btn ghost" id="best">Pick the best seats for me</button>
    <button class="btn ghost" id="big">View from your seat full screen</button>
    <button class="btn" id="go" disabled>Select a seat to continue</button>
  </div>
</div>
</main>
<div class="ov" id="ov"><div><p><span id="ovt"></span><button id="x">Close</button></p><canvas id="cv2" width="1280" height="720"></canvas></div></div>

 for(let i=0;i<n;i++){
  const xa=-SW+2*SW*i/n,xb=-SW+2*SW*(i+1)/n,a=P(xa,STOP,0),b=P(xb,STOP,0),c=P(xa,SBOT,0);
  g.setTransform((b[0]-a[0])/sw,(b[1]-a[1])/sw,(c[0]-a[0])/sh,(c[1]-a[1])/sh,a[0],a[1]);
  g.drawImage(SRC,i*sw,0,sw+1,sh,0,0,sw+1,sh);
 }
 g.setTransform(1,0,0,1,0,0);
 for(let rr=0;rr<Math.ceil(r);rr++){
  const fl=rr*CF.rise,z=-(CF.d0+rr*CF.rd);
  seats.filter(s=>s.r===rr).forEach(s=>{
   if(s.res){const h=P(s.x,fl+1.1+(s.n%3)*.03,z+.35),sh2=P(s.x,fl+.85,z+.35),rad=f*.12/Math.max(h[2],.4);if(h[2]<.4)return;
    g.fillStyle='#0a0a0c';g.beginPath();g.arc(h[0],h[1],rad,0,7);g.fill();
    g.beginPath();g.ellipse(sh2[0],sh2[1]+rad*.4,rad*2.1,rad*1.6,0,0,7);g.fill()}
  });
  seats.filter(s=>s.r===rr).forEach(s=>{
   const hw=CF.sp*.46,a=P(s.x-hw,fl,z),b=P(s.x+hw,fl,z),c=P(s.x+hw,fl+1,z),d=P(s.x-hw,fl+1,z);
   if(Math.min(a[2],b[2],c[2],d[2])<.4)return;g.fillStyle=CF.seat;g.strokeStyle=`rgba(${GLOW},.4)`;g.lineWidth=1.5;
   g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath();g.fill();g.stroke();
  });
 }
 const v=g.createLinearGradient(0,H*.7,0,H);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.85)');
 g.fillStyle=v;g.fillRect(0,H*.7,W,H*.3);const vg=g.createRadialGradient(cx,cy,H*.35,cx,cy,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=vg;g.fillRect(0,0,W,H);
 const ang=angOf(st);
 const up=Math.atan2(STOP-ey,-ez)*180/Math.PI;
 return{ang,up,dist:-ez};
}
function verdict(a){return a>62?['Very close','The screen fills your whole view. You will be looking around a lot.']:a>48?['Immersive','Big and wide, with the screen filling most of your view.']:a>34?['Ideal','A comfortable view where the whole screen is easy to take in.']:['Far back','Relaxed and wide, but the picture looks smaller.']}
function label(s){return `Row ${ROWS[s.r]}, seat ${s.n}`}
let cur=null,tgt=null,anim=0;
function kick(){if(!anim)anim=requestAnimationFrame(tick)}
function tick(){anim=0;if(!cur||!tgt)return;cur.x+=(tgt.x-cur.x)*.2;cur.r+=(tgt.r-cur.r)*.2;const done=Math.abs(tgt.x-cur.x)<.01&&Math.abs(tgt.r-cur.r)<.01;if(done){cur.x=tgt.x;cur.r=tgt.r}draw($('#cv'),cur);if(!done)kick()}
function render(){
 const s=hov||sel||defSeat();
 if(!s)return;
 tgt=s;if(!cur)cur={x:s.x,r:s.r};kick();const info={ang:angOf(s),up:Math.atan2(STOP-(s.r*CF.rise+1.15),CF.d0+s.r*CF.rd)*180/Math.PI,dist:CF.d0+s.r*CF.rd};
 $('#vt').textContent=label(s)+(hov&&hov!==sel?' (preview)':'');
 $('#s1').textContent=Math.round(info.ang)+'°';$('#s2').textContent=Math.round(info.up)+'°';$('#s3').textContent=info.dist.toFixed(1)+' m';
 const vd=verdict(info.ang);$('#vd').textContent=vd[0];$('#vn').textContent=vd[1];
 $('#go').disabled=!picked.length;$('#chips').innerHTML=picked.map(p=>`<button class="chip2 ${p===sel?'on':''}" data-p="${p.k}">${ROWS[p.r]}${p.n}</button>`).join('');$('#go').textContent=picked.length?`Continue with ${picked.length} seat${picked.length>1?'s':''} ($${price()*picked.length})`:'Select a seat to continue';
 $('#seatTitle').textContent=ses===null?'Choose your seat':`${mv.title}, ${CINS[cin].t[ses][0]} (${CINS[cin].t[ses][1]})`;
}

document.addEventListener('click',e=>{
 const m=e.target.closest('.mv'),d=e.target.closest('[data-d]'),c=e.target.closest('[data-c]'),s=e.target.closest('.s');
 if(m)setMovie(movies[+m.dataset.i]);
 else if(d){day=+d.dataset.d;renderDays();buildSeats();renderMap();render()}
 else if(c){cin=+c.dataset.c;ses=+c.dataset.s;setScreen();renderCins();buildSeats();renderMap();render();$('#seatTitle').scrollIntoView({behavior:'smooth',block:'start'})}
 else if(e.target.closest('[data-p]')){sel=byKey[e.target.closest('[data-p]').dataset.p];render()}
 else if(s&&!s.disabled){const k=byKey[s.dataset.k],i=picked.indexOf(k);if(i>=0){picked.splice(i,1);sel=picked[picked.length-1]||null}else if(picked.length<8){picked.push(k);sel=k}renderMap();render()}
});
const map=$('#map');
map.addEventListener('mouseover',e=>{const s=e.target.closest('.s');if(s&&!s.disabled&&hov!==byKey[s.dataset.k]){hov=byKey[s.dataset.k];render()}});
map.addEventListener('mouseleave',()=>{hov=null;render()});
map.addEventListener('focusin',e=>{const s=e.target.closest('.s');if(s){hov=byKey[s.dataset.k];render()}});
$('#best').onclick=()=>{const q=+$('#qty').value;let best=null,bs=1e9;
 for(let r=0;r<CF.L.length;r++){const rs=seats.filter(s=>s.r===r).sort((a,b)=>a.col-b.col);
  for(let i=0;i+q<=rs.length;i++){const g=rs.slice(i,i+q);if(g.some((s,j)=>s.res||s.w||(j&&s.col!==g[j-1].col+1)))continue;
   const cx=g.reduce((a,s)=>a+s.x,0)/q,sc=Math.abs(angOf({x:cx,r})-42)+Math.abs(cx)*3;if(sc<bs){bs=sc;best=g}}}
 if(best){picked=best.slice();sel=picked[0];renderMap();render()}};
$('#big').onclick=()=>{const s=hov||sel||defSeat();$('#ovt').textContent=label(s);$('#ov').classList.add('on');draw($('#cv2'),s)};
$('#x').onclick=()=>$('#ov').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('on')});

async function load(){
 try{
  const r=await fetch('https://api.themoviedb.org/3/movie/now_playing?region=NZ&language=en-NZ',{headers:{Authorization:'Bearer '+TOKEN}});
  const j=await r.json();
  if(j.results&&j.results.length)movies=j.results.slice(0,10).map(m=>({id:m.id,title:m.title,hue:(m.id*37)%360,live:true,year:(m.release_date||'').slice(0,4),poster:m.poster_path?IMG+'w342'+m.poster_path:null,back:m.backdrop_path?IMG+'w1280'+m.backdrop_path:null}));
 }catch(e){}
 $('#src').textContent=movies[0].live?'Live from TMDB':'Demo titles';setMovie(movies[0]);
}
setScreen();renderDays();renderCins();buildSeats();renderMap();bake();renderMovies();render();load();
</script>
